<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Seoul Parcel Lockers — From source to decision</title>
  <desc id="desc">A simplified architecture of an implemented individual learning project: public files stored in Google Cloud Storage and loaded to BigQuery, staging, intermediate and mart tables modeled with dbt, facility comparisons in Python with a 25-district summary written back to BigQuery, and five Looker Studio views. The schematic does not imply a scheduled production service or a measured policy outcome.</desc>
