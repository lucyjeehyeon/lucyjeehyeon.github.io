<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="cover-title cover-description">
  <title id="cover-title">Reading urban risk — Seoul spatial research</title>
  <desc id="cover-description">Portfolio cover for a tree-based pothole factor study. The unfilled Seoul map is geographic context only: 25 actual district boundaries from the local BND_SIGUNGU_PG administrative SHP, dated 2025-06-30 and simplified in its native EPSG:5186 projection. It does not show pothole locations, risk estimates, or findings by district. The branching motif is conceptual, not a fitted decision tree. Study scale: 333,858 records and 37 variables.</desc>
  <metadata>Boundary provenance: local mission17-seoul-locker-analysis/data/boundary/BND_SIGUNGU_PG.shp with matching DBF/SHX/PRJ; 252 national records, 25 Seoul district codes beginning 11; base date 20250630. Simplification: Douglas-Peucker 85 metres, preserving 25 records and north-up orientation. Study evidence: evidence-other.js data scale and published conference paper.</metadata>
