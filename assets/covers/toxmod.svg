<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">ToxMod Ethics Assessment — Protection, with recourse</title>
  <desc id="desc">A conceptual illustration of proposed governance questions for voice-moderation AI: clear consent, human review and meaningful appeal. This is a document-based qualitative ethics assessment, not a depiction of ToxMod's verified operating workflow, a compliance audit or a direct model-performance test.</desc>
