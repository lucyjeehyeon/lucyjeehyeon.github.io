<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Voice phishing — From scripts to signals</title>
  <desc id="desc">An exploratory Korean text-analysis workflow built from 185 collected case-script documents and related YouTube metadata. The illustration describes document conversion, relevance checking, Korean text cleaning, stopword removal, noun extraction with KoNLPy, and exploratory analysis. The document count is not a labeled evaluation-set size. No word frequencies, detection accuracy, or deployed fraud-detection capability are represented.</desc>
  <defs>
    <style>.ink{fill:#22332f}.muted{fill:#64756b}.sage{fill:#367560}.mono{font-family:'Cascadia Mono',Consolas,monospace;font-size:16px;letter-spacing:1.6px}.sans{font-family:'Segoe UI',Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}</style>

  </defs>
  <rect width="1200" height="750" fill="#eeeee7"/>
  <text x="64" y="70" class="mono sage">VOICE PHISHING / TEXT ANALYTICS</text>
  <text x="1136" y="70" class="mono muted" text-anchor="end">14</text>
  <path d="M64 102H1136" stroke="#c9d3c9" fill="none"/>
  <g class="sans">
    <text x="78" y="211" class="mono muted" font-size="13">COLLECTED SOURCE DOCUMENTS</text>
    <text x="72" y="321" class="serif ink" font-size="108" letter-spacing="-2.5">185</text>
    <text x="78" y="365" class="muted" font-size="22">case-script documents</text>
    <text x="78" y="441" class="ink" font-size="18">+ related video metadata</text>
  </g>
  <g stroke="#c9d3c9" stroke-width="1.5" fill="none" aria-hidden="true">
    <path d="M441 318H1091"/>
    <path d="M485 208V260M738 208V260M991 208V260"/>
  </g>
  <g fill="#eeeee7" stroke="#367560" stroke-width="1.8" aria-hidden="true">
    <circle cx="485" cy="318" r="22"/><circle cx="738" cy="318" r="22"/><circle cx="991" cy="318" r="22"/>
  </g>
  <g fill="#367560" aria-hidden="true">
    <circle cx="485" cy="318" r="4"/><circle cx="738" cy="318" r="4"/><circle cx="991" cy="318" r="4"/>
  </g>
  <g class="mono sage" text-anchor="middle" font-size="13">
    <text x="485" y="192">CONVERT</text>
    <text x="738" y="192">CLEAN</text>
    <text x="991" y="192">EXPLORE</text>
  </g>
  <g class="sans ink" text-anchor="middle" font-size="21">
    <text x="485" y="389">Documents</text><text x="485" y="418" class="muted">to DataFrame</text>
    <text x="738" y="389">Relevance</text><text x="738" y="418" class="muted">and Korean text</text>
    <text x="991" y="389">Noun extraction</text><text x="991" y="418" class="muted">and patterns</text>
  </g>
  <path d="M456 475H1020" fill="none" stroke="#c9d3c9"/>
  <text x="738" y="510" text-anchor="middle" class="mono muted" font-size="13" letter-spacing="1">PYTHON / PANDAS / KONLPY</text>
  <text x="64" y="624" class="serif ink" font-size="64" letter-spacing="-1.2">From scripts to signals.</text>
  <path d="M64 655H1136" stroke="#c9d3c9" fill="none"/>
  <g class="mono muted" font-size="16" letter-spacing=".7">
    <text x="64" y="691">COLLECTION → KOREAN TEXT</text>
    <text x="1136" y="691" text-anchor="end">EXPLORATORY ANALYSIS</text>
